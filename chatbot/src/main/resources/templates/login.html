<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>IAM Assistant — Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F4F5F7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #0052CC;
            color: #fff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
        .header .badge {
            font-size: 11px;
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 12px;
        }
        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.12);
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
        }
        .card h1 {
            font-size: 22px;
            font-weight: 600;
            color: #172B4D;
            margin-bottom: 6px;
        }
        .card .subtitle {
            font-size: 14px;
            color: #6B778C;
            margin-bottom: 28px;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #172B4D;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #DFE1E6;
            border-radius: 4px;
            font-size: 14px;
            color: #172B4D;
            transition: border-color 0.15s;
            outline: none;
        }
        .form-group input:focus { border-color: #0052CC; }
        .btn-login {
            width: 100%;
            padding: 11px;
            background: #0052CC;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 4px;
        }
        .btn-login:hover { background: #0065FF; }
        .alert {
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 18px;
        }
        .alert-error { background: #FFEBE6; color: #BF2600; border: 1px solid #FF8F73; }
        .alert-success { background: #E3FCEF; color: #006644; border: 1px solid #79F2C0; }
    </style>
</head>
<body>
<div class="header">
    <span class="logo">IAM Assistant</span>
    <span class="badge">Powered by IAM</span>
</div>
<div class="container">
    <div class="card">
        <h1>Sign in</h1>
        <p class="subtitle">Enter your credentials to access the chatbot.</p>

        <div th:if="${param.error}" class="alert alert-error">
            Invalid username or password. Please try again.
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            You have been signed out successfully.
        </div>
        <div th:if="${param.required}" class="alert alert-error">
            Please sign in to continue.
        </div>

        <form method="post" action="/login">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" type="text"
                       placeholder="Enter username" autofocus autocomplete="username"/>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password"
                       placeholder="Enter password" autocomplete="current-password"/>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
    </div>
</div>
</body>
</html>
