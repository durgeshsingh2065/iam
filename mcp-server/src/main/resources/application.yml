server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: iam-mcp-server
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# IAM knowledge base — every *.pdf in DOCS_PDF_DIRECTORY is indexed (label = file name).
# Drop SailPoint / IAM policy / process PDFs into ./docs-library and call
# POST /admin/knowledge/reload (no restart needed).
docs:
  pdf:
    directory: ${DOCS_PDF_DIRECTORY:classpath:/docs-library}
    files: []
    chunk-size: 800
    chunk-overlap: 150
    max-results: 5

# SailPoint SCIM 2.0 read APIs (scim_list_resources, scim_get_resource).
# auth-type: BASIC (username/password) or BEARER (token). Credentials should come from the environment.
sailpoint:
  scim:
    base-url: ${SAILPOINT_SCIM_BASE_URL:${SAILPOINT_BASE_URL:}}
    auth-type: ${SAILPOINT_SCIM_AUTH_TYPE:BASIC}
    username: ${SAILPOINT_SCIM_USERNAME:${SAILPOINT_USERNAME:}}
    password: ${SAILPOINT_SCIM_PASSWORD:${SAILPOINT_PASSWORD:}}
    bearer-token: ${SAILPOINT_SCIM_BEARER_TOKEN:}
    base-path: ${SAILPOINT_SCIM_BASE_PATH:/identityiq/scim/v2}
    max-response-chars: ${SAILPOINT_SCIM_MAX_RESPONSE_CHARS:20000}
    max-results: ${SAILPOINT_SCIM_MAX_RESULTS:50}

# MCP Server identity. api-key has no default: startup fails fast if unset.
mcp:
  server:
    name: iam-mcp-server
    version: 1.0.0
    api-key: ${MCP_SERVER_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.iam.assistant: INFO
    org.springframework.web: OFF
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  # Log files go to LOG_DIR (created if missing). Set LOG_DIR to any directory you want.
  file:
    name: ${LOG_DIR:./logs}/iam-mcp-server.log
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:10MB}
      max-history: ${LOG_MAX_HISTORY:30}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:1GB}
